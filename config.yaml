# Specify timezone as IANA style timezone. Required
timezone: America/Chicago

# Specify the period for evaluation of the calendar entries
evaluation_period: 30s

# Specify the period for rechecking currently set light colors
recheck_period: 5m

# Specify the lights and their IP addresses
lights:
  front_flood_ll: 192.168.20.202
  front_flood_lr: 192.168.20.56
  front_flood_cl: 192.168.20.12
  front_flood_cr: 192.168.20.2
  front_flood_rl: 192.168.20.64
  front_flood_rr: 192.168.20.138
  porch_l: 192.168.20.196
  porch_c: 192.168.20.223
  porch_r: 192.168.20.195
  patio_ceiling_1: 192.168.20.165
  patio_ceiling_2: 192.168.20.111
  patio_wall: 192.168.20.168
  patio_string: 192.168.20.239
  office_stand_light_upper: 192.168.20.13
  office_stand_light_lower: 192.168.20.244
  office_minecraft_lamp: 192.168.20.163
  office_ceiling_1: 192.168.20.192
  office_ceiling_2: 192.168.20.251
  office_ceiling_3: 192.168.20.84

# Valid color specs:
# Where RR,GG,BB are RGB hex values
# Where CC, WW are cold and white hex values
# Where brightness = 10-100
# Where speed = 20-200
# #RRGGBB(/brightness)
# #RRGGBBCCWW(/brightness)
# #CCWW(/brightness)
# W<temperature>(/brightness)
# scene(/brightness(/speed))
colors:
  red: "#FF0000"
  green: "#00FF00"
  blue: "#0000FF"
  orange: "#FF8000"
  purple: "#5800FF"
  warmest_white: W2200
  warm_white: W2700
  warm_white_50: W2700/50
  warm_white_30: W2700/30
  warmish_white: W3300
  daylight: W5800
  cool_white: W6500
  pastel_purple: "#B497E7"
  pastel_blue: "#00FF87"
  pastel_yellow: "#FFC400"
  pastel_seafoam: "#00FF13"
  pastel_green: "#12FF12"
  pastel_pink: "#FF001A"
  light_blue: "#1887FF"
  yellow: "#FFFF00"
  cyan: "#02FFDD"
  pinkish: "#FFD8D9"
  magenta: "#DC00FF"
  greenish: "#30FF00"
  
# Group lights, N.B. group all is automatically provided
light_groups:
  all: [ front_flood_ll, front_flood_lr, front_flood_cl, front_flood_cr, front_flood_rl, front_flood_rr, porch_l, porch_c, porch_r, patio_ceiling_1, patio_ceiling_2, patio_wall, patio_string, office_stand_light_upper, office_stand_light_lower, office_minecraft_lamp, office_ceiling_1, office_ceiling_2, office_ceiling_3 ]
  outside_lights: [front_flood_ll, front_flood_lr, front_flood_cl, front_flood_cr, front_flood_rl, front_flood_rr, porch_l, porch_c, porch_r, patio_ceiling_1, patio_ceiling_2, patio_wall, patio_string]
  flood_left: [front_flood_ll, front_flood_lr]
  flood_center: [front_flood_cl, front_flood_cr]
  flood_right: [front_flood_rl, front_flood_rr]
  porch: [porch_l, porch_c, porch_r]
  patio: [patio_ceiling_1, patio_ceiling_2, patio_wall, patio_string]
  porch_carriage_lights: [ porch_l, porch_r ]
  office_lights: [ office_stand_light_upper, office_stand_light_lower, office_minecraft_lamp, office_ceiling_1, office_ceiling_2, office_ceiling_3 ]
  office_ceiling: [ office_ceiling_1, office_ceiling_2, office_ceiling_3 ]
  office_stand_light: [ office_stand_light_upper, office_stand_light_lower ]

scenes:
  default:
    - targets:
      - outside_lights
      color: warm_white
    - targets: [ porch_carriage_lights ]
      color: warm_white_50
    - targets: [ office_lights ]
      color: daylight
  overnight:
    - targets:
      - porch_c
      color: warm_white
      brightness: 50
    - targets:
      - porch_carriage_lights
      color: warm_white
      brightness: 30
  halloween:
    - targets: [ outside_lights ]
      color: purple
    - targets: [ porch_c, patio_wall ]
      color: orange
  paddy:
    - targets: [ outside_lights ]
      color: green
  xmas:
    - targets: [ outside_lights ]
      color: red
    - targets: [ flood_left, flood_center, porch_carriage_lights, patio_wall ]
      color: green
  patriotic:
    - targets: [ outside_lights ]
      color: warm_white
    - targets: [ front_flood_ll, front_flood_cl, front_flood_rl, porch_l ]
      color: blue
    - targets: [ front_flood_lr, front_flood_cr, front_flood_rr, porch_r ]
      color: red
    - targets: [ porch_c ]
      color: daylight
  thanksgiving:
    - targets: [ outside_lights ]
      color: orange
  pastel:
    - targets: [ front_flood_ll ]
      color: pastel_purple
    - targets: [ front_flood_lr ]
      color: pastel_blue
    - targets: [ front_flood_cl, porch_r ]
      color: pastel_yellow
    - targets: [ front_flood_cr, porch_c, patio_wall ]
      color: pastel_seafoam
    - targets: [ front_flood_rl, patio_ceiling_1 ]
      color: pastel_green
    - targets: [ front_flood_rr, porch_l, patio_ceiling_2 ]
      color: pastel_pink
  office_warm:
    - targets: [ office_lights ]
      color: warmish_white
      from: jan 1
      to: dec 31
      after: 7:00 pm
  office_bright:
    - targets: [ office_lights ]
      color: cool_white
  office_daylight:
    - targets: [ office_lights ]
      color: daylight
  office_warmest:
    - targets: [ office_lights ]
      color: warmest_white
  office_dim:
    - targets: [ office_lights]
      color: daylight
      brightness: 40
  office_yellow:
    - targets: [ office_lights ]
      color: yellow
  office_blueish:
    - targets: [ office_lights ]
      color: light_blue
  office_pinkish:
    - targets: [ office_lights ]
      color: pinkish
  office_cyan:
    - targets: [ office_lights ]
      color: cyan
  office_greenish:
    - targets: [ office_lights ]
      color: greenish
      
# default_scene must be defined
default_scene: default

calendar:
  - name: halloween
    from: halloween - 10
    to: halloween
    scene: halloween
  - name: easter
    from: good_friday - 5
    to: easter_sunday + 2
    scene: pastel
  - name: independence_day
    from: independence_day - 2
    to: independence_day + 2
    scene: patriotic
  - name: memorial_day
    from: memorial_day
    to: memorial_day
    scene: patriotic
  - name: presidents_day
    from: presidents_day
    to: presidents_day
    scene: patriotic
  - name: xmas
    from: dec 1
    to: dec 31
    scene: xmas
  - name: st_patricks_day
    from: st_patricks_day
    to: st_patricks_day
    scene: paddy
  - name: thanksgiving
    from: thanksgiving_day - 3
    to: thanksgiving_day + 1
    scene: thanksgiving
