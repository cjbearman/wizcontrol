      - targets:
        - porch_c
        color: warm_white_50
      - targets:
        - porch_carriage_lights
        color: warm_white_30
  - name: halloween
    elements:
      - targets: [ outside_lights ]
        color: purple
      - targets: [ porch_c, patio_wall ]
        color: orange
      - targets: [ patio_string ]
        color: halloween_dynamic
    group: outside_lights
