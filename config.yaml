# Valid color specs:
# Where RR,GG,BB are RGB hex values
# Where CC, WW are cold and white hex values
# Where brightness = 10-100
# Where speed = 20-200
# #RRGGBB(/brightness)
# #RRGGBBCCWW(/brightness)
# #CCWW(/brightness)
# W<temperature>(/brightness)
# scene(/brightness(/speed))
colors:
  red: "#FF0000"
  green: "#00FF00"
  blue: "#0000FF"
  orange: "#FF8000"
  purple: "#5800FF"
  warmest_white: W2200
  warm_white: W2700
  warm_white_50: W2700/50
  warm_white_30: W2700/30
  warmish_white: W3300
  daylight: W5800
  daylight40: W5800/40
  cool_white: W6500
  pastel_purple: "#B497E7"
  pastel_blue: "#00FF87"
  pastel_yellow: "#FFC400"
  pastel_seafoam: "#00FF13"
  pastel_green: "#12FF12"
  pastel_pink: "#FF001A"
  light_blue: "#1887FF"
  yellow: "#FFFF00"
  cyan: "#02FFDD"
  pinkish: "#FFD8D9"
  magenta: "#DC00FF"
  greenish: "#30FF00"
  democratic_blue: "#0000FF0005"
  xmas_dynamic: christmas/100/75
  diwali_dynamic: diwali/100/50
  fall_dynamic: fall/100/75
  fireplace_dynamic: fireplace/100/75
  forest_dynamic: forest/100/150
  jungle_dynamic: jungle/100/150
  mojito_dynamic: mojito/100/150
  ocean_dynamic: ocean/100/150
  party_dynamic: party/100/75
  pastel_dynamic: pastelcolors/100/200
  pulse_dynamic: pulse/100/100
  relax_dynamic: relax/100/200
  romance_dynamic: romance/100/200
  spring_dynamic: spring/100/200
  steampunk_dynamic: steampunk/100/75
  summer_dynamic: summer/100/200
  sunset_dynamic: sunset/100/200
  

# Group lights, N.B. group all is automatically provided
light_groups:
  all: [ front_flood_ll, front_flood_lr, front_flood_cl, front_flood_cr, front_flood_rl, front_flood_rr, porch_l, porch_c, porch_r, patio_ceiling_1, patio_ceiling_2, patio_wall, patio_string, office_stand_light_upper, office_stand_light_lower, office_minecraft_lamp, office_ceiling_1, office_ceiling_2, office_ceiling_3 ]
  outside_lights: [front_flood_ll, front_flood_lr, front_flood_cl, front_flood_cr, front_flood_rl, front_flood_rr, porch_l, porch_c, porch_r, patio_ceiling_1, patio_ceiling_2, patio_wall, patio_string]
  floods: [front_flood_ll, front_flood_lr, front_flood_cl, front_flood_cr, front_flood_rl, front_flood_rr ]
  flood_left: [front_flood_ll, front_flood_lr]
  flood_center: [front_flood_cl, front_flood_cr]
  flood_right: [front_flood_rl, front_flood_rr]
  porch: [porch_l, porch_c, porch_r]
  patio_lights: [patio_ceiling_1, patio_ceiling_2, patio_wall, patio_string]
  porch_carriage_lights: [ porch_l, porch_r ]
  office_lights: [ office_stand_light_upper, office_stand_light_lower, office_minecraft_lamp, office_ceiling_1, office_ceiling_2, office_ceiling_3 ]
  office_ceiling: [ office_ceiling_1, office_ceiling_2, office_ceiling_3 ]
  office_stand_light: [ office_stand_light_upper, office_stand_light_lower ]

scenes:
  default:
    - targets:
      - outside_lights
      color: warm_white
    - targets: [ porch_carriage_lights ]
      color: warm_white_50
    - targets: [ office_lights ]
      color: daylight
  overnight:
    - targets:
      - porch_c
      color: warm_white_50
    - targets:
      - porch_carriage_lights
      color: warm_white_30
  halloween:
    - targets: [ outside_lights ]
      color: purple
    - targets: [ porch_c, patio_wall ]
      color: orange
    - targets: [ patio_string ]
      color: wiz_halloween
  paddy:
    - targets: [ outside_lights ]
      color: green
  xmas:
    - targets: [ outside_lights ]
      color: red
    - targets: [ flood_left, flood_center, porch_carriage_lights, patio_wall ]
      color: green
  patriotic:
    - targets: [ outside_lights ]
      color: warm_white
    - targets: [ front_flood_ll, front_flood_cl, front_flood_rl, porch_l ]
      color: blue
    - targets: [ front_flood_lr, front_flood_cr, front_flood_rr, porch_r ]
      color: red
    - targets: [ porch_c ]
      color: daylight
  thanksgiving:
    - targets: [ outside_lights ]
      color: orange
  pastel:
    - targets: [ front_flood_ll ]
      color: pastel_purple
    - targets: [ front_flood_lr ]
      color: pastel_blue
    - targets: [ front_flood_cl, porch_r ]
      color: pastel_yellow
    - targets: [ front_flood_cr, porch_c, patio_wall ]
      color: pastel_seafoam
    - targets: [ front_flood_rl, patio_ceiling_1 ]
      color: pastel_green
    - targets: [ front_flood_rr, porch_l, patio_ceiling_2 ]
      color: pastel_pink
  office_warm:
    - targets: [ office_lights ]
      color: warmish_white
      from: jan 1
      to: dec 31
      after: 7:00 pm
  office_bright:
    - targets: [ office_lights ]
      color: cool_white
  office_daylight:
    - targets: [ office_lights ]
      color: daylight
  office_warmest:
    - targets: [ office_lights ]
      color: warmest_white
  office_dim:
    - targets: [ office_lights]
      color: daylight40
  office_yellow:
    - targets: [ office_lights ]
      color: yellow
  office_blueish:
    - targets: [ office_lights ]
      color: light_blue
  office_pinkish:
    - targets: [ office_lights ]
      color: pinkish
  office_cyan:
    - targets: [ office_lights ]
      color: cyan
  office_greenish:
    - targets: [ office_lights ]
      color: greenish
  go_democrats:
    - targets: [ outside_lights ]
      color: democratic_blue
    - targets: [ patio_lights, porch_c ]
      color: ocean_dynamic

