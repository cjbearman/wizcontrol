system:
  # IANA timezone in which the system will operation.
  # You may get away without setting this, depending on your locale, but best to set it correctly
  timezone: America/Chicago

  # Specify the period for evaluation of the calendar entries
  evaluation_period: 15s

  # Specify the period for rechecking currently set light colors
  recheck_period: 5m

# Include mqtt section if you want to utilize MQTT broker
mqtt:
  # broker URL
  url: "mqtt://192.168.10.189:1883"
  # broker username
  username: "wizcontrol_mqtt"
  # broker password
  password: "asdkljiodsjf23489h!"
  # base topic
  topic: "wizcontrol_dev"
  retain_messages: false

# If any of your lights have MAC addresses configured instead of IPs, they will need discovery
# These parameters control the discovery process for lights with MAC addresses
discovery:
  broadcast_address: "255.255.255.255"
  interval: "30s"
  period: "5s"

# Include http section if you want HTTP API available
http:
  # port on which the HTTP API will listen
  port: 12120

  # To enable HTTPS (TLS) include both cert_chain and key files
  #cert_chain: test_certs/wizcontrol.crt
  #key: test_certs/wizcontrol.key

  # To establish HTTP basic authentication, uncomment and configure the auth block below
  #auth:
   # username: "chris"
    #password: "changeme"


# Specify the lights and their IP addresses or MAC addresses
# If using MAC addresses for any light, discovery will be used (which is not entirely reliable and introduce delays)
